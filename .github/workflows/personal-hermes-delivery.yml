name: Personal Hermes Delivery
on:
  push:
    branches: [main]
    paths:
      - 'nowledge-mem-hermes/**'
      - '.github/phase3-delivery.pending'
      - '.github/workflows/personal-hermes-delivery.yml'
permissions:
  contents: write
concurrency:
  group: personal-hermes-delivery
  cancel-in-progress: false
jobs:
  activate-test-deliver:
    if: github.repository == 'EdgarZhong/hermes-nmem-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check explicit one-time marker
        id: requested
        shell: bash
        run: |
          if test -f .github/phase3-delivery.pending; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Test dependency
        if: steps.requested.outputs.enabled == 'true'
        run: python3 -m pip install 'PyYAML>=6,<7'
      - name: Align registry and activate reviewed fork policy
        if: steps.requested.outputs.enabled == 'true'
        run: python3 nowledge-mem-hermes/apply_phase3.py
      - name: Compile actual plugin modules
        if: steps.requested.outputs.enabled == 'true'
        run: python3 -m compileall -q nowledge-mem-hermes
      - name: Run policy and HTTP fixture tests and write truthful report
        if: steps.requested.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, sys, unittest
          from pathlib import Path
          suite = unittest.defaultTestLoader.discover('nowledge-mem-hermes/personal_tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          root = Path('nowledge-mem-hermes')
          rows = [f'- `{p.name}`: `{hashlib.sha256(p.read_bytes()).hexdigest()}`' for p in sorted(root.glob('*.py'))]
          run = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          text = '\n'.join([
              '# Personal Hermes 0.6.0 — Test report', '',
              'Generated by actual CI execution, not a planned result.', '',
              f'- Tests run: **{result.testsRun}**; failures: **{len(result.failures)}**; errors: **{len(result.errors)}**; skipped: **{len(result.skipped)}**.',
              f'- Python: `{platform.python_version()}`; platform: `{platform.system()}`.',
              f'- CI run: {run}',
              f'- Checkout before activation: `{os.environ["GITHUB_SHA"]}`. The module hashes below identify the tested post-activation source.', '',
              '## Executed coverage', '',
              'Main/cron/auxiliary scope matrix; short Chinese recall; candidate budgets and intact IDs; no model tools; no WM fallback or queue prefetch; Thread delta/cursor/restart/failure/switch/compaction fixtures; metadata preview/create/update/readback; configuration and staged install; real localhost HTTP transport and redirect refusal.', '',
              'The retained upstream client.py, provider.py and skill_outcome.py were imported. Only the Hermes MemoryProvider ABC is stubbed for policy tests. Canonical host history, NM writes and approval context use fixtures. HTTP tests use a disposable localhost server.', '',
              '## Not executed / not claimed', '',
              '- No real user Hermes profile or NM account was accessed.',
              '- No real Hermes Agent loop / NM Server end-to-end acceptance; no proof of production authorization enforcement.',
              '- No macOS/Windows runtime execution; PowerShell launcher remains untested here.',
              '- No exactly-once claim or automatic rewind/edit archive reconciliation.',
              '- No session_search Core implementation in this separate Provider repository.',
              '- No npm/PyPI/marketplace release.', '',
              '## Tested Python source hashes', '', *rows, ''
          ])
          (root / 'docs/TEST_REPORT.md').write_text(text, encoding='utf-8')
          PY
      - name: Commit only validated integration activation
        if: steps.requested.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations.json nowledge-mem-hermes/__init__.py nowledge-mem-hermes/plugin.yaml nowledge-mem-hermes/AGENTS.md nowledge-mem-hermes/setup.sh nowledge-mem-hermes/setup.ps1 nowledge-mem-hermes/CHANGELOG.md nowledge-mem-hermes/docs/TEST_REPORT.md
          git rm .github/phase3-delivery.pending
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert all(p.startswith('nowledge-mem-hermes/') or p in {'integrations.json','.github/phase3-delivery.pending'} for p in paths), paths
          PY
          git commit -m 'feat(hermes): activate tested Personal Hermes NM Provider 0.6.0'
          git push origin HEAD:main
